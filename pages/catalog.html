<!DOCTYPE html>
<html lang="uk">
<head>
  <link rel="stylesheet" href="../assets/styles/style.css">
  <link rel="stylesheet" href="../assets/styles/responsive.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог проектів</title>
</head>
<body>

<header>
  <div class="container header-inner">
    <button class="menu-toggle" type="button" aria-expanded="false" aria-label="Відкрити меню">☰</button>

    <nav class="main-nav">
      <a href="../index.html">Головна</a>
      <a href="about.html">Про мене</a>
      <a href="catalog.html">Каталог</a>
      <a href="contact.html">Контакти</a>
      <a href="favorites.html">Обране</a>
    </nav>

    <button class="theme-toggle" type="button" aria-label="Перемкнути тему">Тема</button>
  </div>
</header>

<main class="container">

  <div class="card">
    <h1>Каталог проектів</h1>
  </div>

  <!-- Фільтри та пошук -->
  <div class="card controls-section">
    <div class="controls-group">
      <!-- Пошук -->
      <div class="search-wrapper">
        <input 
          type="text" 
          class="search-input" 
          data-search
          placeholder="Пошук за назвою, описом або технологіями..."
          aria-label="Пошук проектів"
        >
        <span class="search-icon">🔍</span>
      </div>

      <!-- Фільтр категорій -->
      <select 
        class="filter-select" 
        data-category-filter
        aria-label="Фільтр за категоріями"
      >
        <option value="all">Усі категорії</option>
        <option value="frontend">Frontend</option>
        <option value="backend">Backend</option>
        <option value="design">Design</option>
      </select>

      <!-- Сортування -->
      <select 
        class="filter-select" 
        data-sort
        aria-label="Сортування проектів"
      >
        <option value="date-newest">Новіші</option>
        <option value="date-oldest">Старіші</option>
        <option value="title-asc">По назві (А-Я)</option>
        <option value="title-desc">По назві (Я-А)</option>
        <option value="rating-desc">По рейтингу (спадаючи)</option>
        <option value="rating-asc">По рейтингу (зростаючи)</option>
        <option value="level">По рівню складності</option>
      </select>
    </div>
  </div>

  <!-- Каталог проектів -->
  <div class="card" data-catalog></div>

  <!-- Пагінація -->
  <div class="card" data-pagination></div>

</main>

<!-- Модальне вікно з деталями проекту -->
<div class="modal" data-details-modal hidden>
  <div class="modal-overlay"></div>
  <div class="modal-dialog" role="dialog" aria-modal="true">
    <div data-modal-content></div>
  </div>
</div>

<button class="back-to-top" type="button" hidden>Вгору</button>

<footer>
  <p>&copy; 2026</p>
</footer>

<script src="../js/api.js" defer></script>
<script src="../js/catalog.js" defer></script>
<script src="../js/main.js" defer></script>

</body>
</html>
